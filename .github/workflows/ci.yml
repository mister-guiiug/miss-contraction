# CI déléguée au reusable workflow famille (dev-pwa-config).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-ci.yml@v6
    # PAS de `secrets: inherit` : ce workflow n'en déclare aucun, et
    # `GITHUB_TOKEN` lui est fourni d'office. Hériter enverrait TOUS les
    # secrets du dépôt à un workflow qui n'en demande pas un seul.
    with:
      run-doctor: true # la checklist du parc, lue sur le dépôt et sur dist/ (AMELIORATIONS.md, T2)
      # `doctor-strict` reste à `false`, et voici pourquoi. Relevé du 19/09/2026 :
      # le docteur rend « 0 défaut(s) » ici, mais pas « 0 dette(s) » — et
      # `--strict` échoue sur une dette (pwa-doctor.mjs:1631). Ce qui bloque,
      # cette PR appliquée :
      #   · code source + soutien sur 3 écrans (AboutView, ChecklistView, HomeView) : deux au plus
      # Le mode strict s'active quand cette liste est vide. Pas avant : une CI
      # rouge sur une dette connue et non traitée n'apprend rien à personne.
      # La suite existait et ne tournait nulle part : le docteur le disait en
      # dette (« les e2e ne tournent pas en CI »), et rien ne peut échouer sur
      # une dette. Mesuré le 19/09/2026 avec la commande exacte du
      # réutilisable : 31 tests, 1 min 20, tous verts.
      #
      # PAS `.*` ici, et c'est délibéré : la suite entière compte 308 tests en
      # 18 fichiers — @load, @stress, @visual, @performance, @mobile. Ce sont
      # des campagnes locales (`npm run test:e2e:load`, `:visual`, …), pas un
      # portillon de PR. Le docteur signalera donc les 13 fichiers que le
      # filtre laisse dehors, et c'est un progrès : la dette remplacée disait
      # « aucun e2e en CI », la nouvelle nomme exactement ce qui n'y est pas.
      run-e2e: true
      # Second avis TypeScript 7, NON BLOQUANT. La 6 reste la référence : c'est
      # elle que typescript-eslint résout, et il refuse la 7.0 par une assertion
      # à l'import. Le jour où typescript-eslint#10940 se ferme, cette entrée
      # et l'alias `typescript-7` disparaissent ensemble.
      run-type-check-7: true
