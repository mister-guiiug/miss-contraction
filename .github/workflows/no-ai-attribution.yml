# Refuse les signatures d'assistant IA sur les pull requests.
#
# Les hooks `commit-msg` et `pre-commit` couvrent le poste de travail, mais ils
# se contournent (`git commit --no-verify`) et ne sont installés qu'après un
# `npm install`. Ce contrôle-ci relit les commits poussés : c'est le seul qui
# ne dépende de la bonne volonté de personne.
name: Signatures IA

on:
  pull_request:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Il faut l'historique des deux côtés pour lister les commits de la
          # branche ; `fetch-depth: 0` est le plus simple et le dépôt est petit.
          fetch-depth: 0

      - name: Relire les messages de commit de la branche
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          echo "Commits examinés :"
          git log --format='  %h %s' "$base..$head"

          faute=0
          for sha in $(git rev-list "$base..$head"); do
            git log -1 --format='%B' "$sha" > /tmp/msg.txt
            if ! node scripts/check-ai-attribution.mjs --message /tmp/msg.txt; then
              echo "  ↑ commit $sha"
              faute=1
            fi
          done
          exit $faute

      - name: Relire les fichiers modifiés
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          fichiers=$(git diff --name-only --diff-filter=ACMR "$base..$head")
          [ -z "$fichiers" ] && exit 0
          node scripts/check-ai-attribution.mjs --files $fichiers
