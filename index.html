<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy en défense en profondeur.
      'unsafe-inline' : script anti-FOUC + snippets GTM/GA4 injectés au build,
      styles Tailwind/vite-plugin-pwa. Autorisations tierces limitées à
      Google Fonts (styles/polices) et Google Tag Manager / GA4 (analytics).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://www.googletagmanager.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <!-- Script anti-FOUC : applique le thème avant tout rendu -->
    <script>
      (function () {
        try {
          var k = 'mc_theme';
          var v = localStorage.getItem(k);
          var eff;
          if (v === 'light' || v === 'dark') eff = v;
          else
            eff = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', eff);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"

    />
    <link
      rel="icon"

      sizes="512x512"
      href="icons/icon-512.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta id="meta-theme-color" name="theme-color" content="#a0309a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
