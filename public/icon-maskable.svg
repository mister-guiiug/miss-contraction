<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Miss Contraction">
  <title>Miss Contraction</title>
  <!--
    LE MASKABLE, ET POURQUOI CE N'EST PAS `icon.svg` EN PLUS PETIT.

    UNE SEULE DIFFÉRENCE AVEC LA SOURCE : le `rx="112"` disparaît. L'aplat
    occupe la toile entière, donc il n'y a plus de bord à raccorder quel que
    soit le masque de l'appareil — cercle, squircle, goutte.

    AUCUNE RÉDUCTION. Le disque fait 168 de rayon pour une zone de sécurité à
    204,8, et la spirale est CREUSÉE dedans : son point le plus extérieur, bout
    de trait compris, tombe à 149. C'est le disque qui commande, et il lui reste
    trente-six pixels. Le calcul est celui qu'`icon.svg` porte déjà dans son
    propre commentaire — ne pas agrandir le disque sans le refaire.

    CE FICHIER SERT AUSSI À L'ICÔNE APPLE. iOS n'accepte pas la transparence et
    comble les coins de la tuile arrondie par une couleur ; une source à fond
    perdu n'a, elle, aucun coin à combler. L'aplat `#3d2438` n'est donc écrit
    qu'ICI et dans `icon.svg` — pas une troisième fois dans une option de
    couleur de fond passée au générateur, qui vieillirait de son côté.
  -->
  <rect width="512" height="512" fill="#3d2438" />
  <circle cx="256" cy="256" r="168" fill="#f4c2c2" />
  <path
    d="M 256 256 A 20 20 0 0 1 216 256 A 63 63 0 0 1 342 256 A 109 109 0 0 1 124 256"
    fill="none"
    stroke="#3d2438"
    stroke-width="34"
    stroke-linecap="round"
  />
</svg>
